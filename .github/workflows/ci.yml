name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Unit test coverage
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: Verify build artefacts
        run: |
          test -f dist/index.html
          test -f dist/pdf.worker.min.mjs
          test -f dist/sw.js
          test -f dist/sitemap.xml
          test -f dist/og-image.svg
          test -d dist/tool
          node -e "const fs=require('fs');const html=fs.readFileSync('dist/index.html','utf8');if(!/<div id=\"root\">/.test(html))throw new Error('missing app root');if(!/assets\/.+\.js/.test(html))throw new Error('missing hashed entry chunk');console.log('build artefacts OK')"
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production bundle
        run: npm run build
      - name: Generate e2e fixtures
        run: node scripts/e2e-fixtures.cjs
      - name: Run end-to-end suite
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/results
            test-results
          retention-days: 7
